<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="color-scheme" content="light dark">
<title>Expense Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231565c0'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ERs%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--text:#14202e;--muted:#5d6b7c;--line:#e1e8f1;
  --primary:#1565c0;--on-primary:#ffffff;--head:#1565c0;--on-head:#ffffff;
  --hero:linear-gradient(135deg,#1976d2,#0d47a1);
  --red:#c62828;--green:#2e7d32;--amber:#f9a825;--shadow:0 1px 3px rgba(16,40,80,.08),0 6px 18px rgba(16,40,80,.06);
}
[data-theme="dark"]{
  --bg:#0d1520;--card:#162230;--text:#e6ecf4;--muted:#9aaabd;--line:#243446;
  --primary:#64b5f6;--on-primary:#06223a;--head:#162230;--on-head:#64b5f6;
  --hero:linear-gradient(135deg,#1f5a96,#123a66);
  --red:#ef7b78;--green:#6fcf76;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.app{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--on-head);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));font-weight:800;font-size:19px;letter-spacing:.2px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.hbtn{border:0;background:rgba(255,255,255,.92);color:inherit;width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.hbtn.on{box-shadow:0 0 0 3px rgba(255,255,255,.5)}
[data-theme="dark"] .hbtn{background:rgba(255,255,255,.14)}
[data-theme="dark"] .hbtn.on{background:rgba(100,181,246,.35);box-shadow:none}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{background:var(--hero);color:#fff;border:0}
.hero .sub{opacity:.85;font-size:13px}
.big{font-size:32px;font-weight:800;margin:2px 0 8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.pos{color:var(--green)}.neg{color:var(--red)}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.prog>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.warn .prog>i{background:var(--amber)}
.over .prog>i{background:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.warn .tag{background:#fff3cd;color:#8a6100}.over .tag{background:#fde0e0;color:var(--red)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tx .amt{font-weight:700;white-space:nowrap}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 2px;display:flex;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--primary);color:var(--on-primary);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.danger{background:var(--red);color:#fff}
.btn.small{width:auto;padding:9px 14px;font-size:14px}
.btn+.btn{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
label input,label select{margin-top:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:8px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--text)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:none;color:var(--muted);padding:9px 0 8px;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--primary)}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);margin:0 auto 10px;font-size:32px;font-weight:400;line-height:1;justify-content:center;box-shadow:0 4px 14px rgba(21,101,192,.45);padding:0 0 3px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);z-index:21;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2a3b;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar{width:100%;max-width:38px;background:var(--primary);border-radius:7px 7px 3px 3px;min-height:3px;opacity:.9}
.bar.zero{background:var(--line);opacity:1}
.bval{font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.blab{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap}
.donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.hole{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;line-height:1.2;padding:4px}
.legend{flex:1;min-width:160px}
.legend .tx{cursor:default;padding:7px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-size:17px;margin-top:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.banner{border-left:5px solid var(--amber);}
.tag.late{background:#fde0e0;color:#b71c1c}
.tag.soon{background:#fff3cd;color:#8a6100}
[data-theme="dark"] .tag.late{background:#4a2224;color:#ffb4b0}
[data-theme="dark"] .tag.soon{background:#4a3d12;color:#ffe08a}
.hide{display:none!important}
</style>
</head>
<body>
<noscript><p style="padding:20px;font-family:sans-serif">Please enable JavaScript to use the Expense Tracker.</p></noscript>
<div class="app">
  <header><span id="title">Expense Tracker</span><button class="hbtn" data-a="tab" data-tab="settings" aria-label="Settings">⚙️</button></header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="in">
  <button data-a="tab" data-tab="home"><span class="ic">🏠</span>Home</button>
  <button data-a="tab" data-tab="reports"><span class="ic">📊</span>Reports</button>
  <button class="fab" id="fab" data-a="add" aria-label="Add transaction">+</button>
  <button data-a="tab" data-tab="loans"><span class="ic">🤝</span>Borrowed</button>
  <button data-a="tab" data-tab="history"><span class="ic">🧾</span>History</button>
</div></nav>
<div id="sheetRoot"></div>
<div id="toast" class="toast hide" role="status"></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hide">

<script>
(function(){
'use strict';

/* ---------- constants & state ---------- */
var LS_KEY='expense_tracker_v1';
var PALETTE=['#1565c0','#ef6c00','#6a1b9a','#00838f','#2e7d32','#c62828','#f9a825','#37474f','#ad1457','#4e342e'];
var DEFAULT_CATS=[
  {name:'Food',type:'expense',color:'#ef6c00',custom:false},
  {name:'Stationery',type:'expense',color:'#6a1b9a',custom:false},
  {name:'Travel',type:'expense',color:'#00838f',custom:false},
  {name:'Others',type:'expense',color:'#546e7a',custom:false},
  {name:'From Parents',type:'income',color:'#2e7d32',custom:false},
  {name:'From Friends',type:'income',color:'#558b2f',custom:false},
  {name:'Pocket Money',type:'income',color:'#1565c0',custom:false},
  {name:'Other Income',type:'income',color:'#37474f',custom:false}
];
var COLOR_RE=/^#[0-9a-fA-F]{6}$/, DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

function defaults(){
  return {txns:[],cats:DEFAULT_CATS.map(function(c){return Object.assign({},c)}),budget:4000,weekStart:1,theme:'system',loans:[],loansInBalance:true};
}
var state=load();
var ui={tab:'home',period:'week',wOff:0,mOff:0,q:'',ftype:'all',fcat:'all',newColor:PALETTE[0]};
var form=null, lform=null;

function load(){
  var d=defaults();
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(raw){
      var s=JSON.parse(raw);
      if(s && Array.isArray(s.txns)) d.txns=s.txns;
      if(s && Array.isArray(s.cats) && s.cats.length) d.cats=s.cats;
      if(s && isFinite(+s.budget) && +s.budget>=0) d.budget=+s.budget;
      if(s && (s.weekStart===0||s.weekStart===1)) d.weekStart=s.weekStart;
      if(s && ['system','light','dark'].indexOf(s.theme)>-1) d.theme=s.theme;
      if(s && Array.isArray(s.loans)) d.loans=s.loans;
      if(s && s.loansInBalance===false) d.loansInBalance=false;
    }
  }catch(e){}
  return d;
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}
  catch(e){toast('Could not save – browser storage is blocked or full');}
}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayStr(){return ymd(new Date());}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function weekStartOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var diff=(x.getDay()-state.weekStart+7)%7;x.setDate(x.getDate()-diff);return x;}
function weekRange(off){var s=addDays(weekStartOf(new Date()),off*7);return [ymd(s),ymd(addDays(s,6))];}
function monthRange(off){var n=new Date();var a=new Date(n.getFullYear(),n.getMonth()+off,1);var b=new Date(n.getFullYear(),n.getMonth()+off+1,0);return [ymd(a),ymd(b)];}
function inR(t,a,b){return t.date>=a && t.date<=b;}
function sum(list,type){var s=0;for(var i=0;i<list.length;i++){if(!type||list[i].type===type)s+=list[i].amount;}return Math.round(s*100)/100;}
function fmt(n){var v=Number(n)||0;var s;try{s=Math.abs(v).toLocaleString('en-PK',{maximumFractionDigits:2});}catch(e){s=Math.abs(v).toFixed(2);}return (v<0?'-':'')+'Rs. '+s;}
function short(n){return n>=1000?(n/1000).toFixed(n%1000?1:0)+'k':String(Math.round(n));}
function fmtD(s,withYear){return parse(s).toLocaleDateString('en-GB',withYear?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'});}
function fmtMonth(s){return parse(s).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function dayName(s){return parse(s).toLocaleDateString('en-GB',{weekday:'short'});}
function dayHead(s){return parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});}
function sortTx(list){return list.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);});}
function catColor(name,type){for(var i=0;i<state.cats.length;i++){var c=state.cats[i];if(c.name===name&&(!type||c.type===type))return COLOR_RE.test(c.color)?c.color:'#78909c';}return '#78909c';}
function nextDate(s,recur){
  var d=parse(s);
  if(recur==='weekly')return ymd(addDays(d,7));
  var day=d.getDate();var n=new Date(d.getFullYear(),d.getMonth()+1,1);
  var last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();n.setDate(Math.min(day,last));return ymd(n);
}
var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.add('hide');},3400);}

function applyTheme(){
  var t=state.theme;
  if(t==='system'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#162230':'#1565c0');
}

/* ---------- borrowed money ---------- */
function loanPaid(l){var s=0;(l.payments||[]).forEach(function(p){s+=p.amount;});return Math.round(s*100)/100;}
function loanLeft(l){return Math.max(0,Math.round((l.amount-loanPaid(l))*100)/100);}
function totalOwed(){var s=0;state.loans.forEach(function(l){s+=loanLeft(l);});return Math.round(s*100)/100;}
function loanCashNet(){var s=0;state.loans.forEach(function(l){s+=l.amount-loanPaid(l);});return Math.round(s*100)/100;}
function balanceNow(){var b=sum(state.txns,'income')-sum(state.txns,'expense');if(state.loansInBalance)b+=loanCashNet();return Math.round(b*100)/100;}
function daysUntil(s){return Math.round((parse(s)-parse(todayStr()))/86400000);}
function personNames(){var n=[];state.loans.forEach(function(l){if(n.indexOf(l.person)<0)n.push(l.person);});return n;}
function sortLoans(list){return list.slice().sort(function(a,b){return a.date<b.date?1:-1;});}
function dueTag(l){
  if(!l.due||loanLeft(l)<=0)return '';
  var d=daysUntil(l.due);
  if(d<0)return '<span class="tag late">Overdue '+(-d)+'d</span>';
  if(d===0)return '<span class="tag late">Due today</span>';
  if(d<=3)return '<span class="tag soon">Due in '+d+'d</span>';
  return '<span class="tag">Pay by '+fmtD(l.due)+'</span>';
}
function loanRow(l){
  var left=loanLeft(l), paid=loanPaid(l), pct=Math.min(100,Math.round(paid/l.amount*100));
  return '<div class="tx loan" data-a="loan-open" data-id="'+esc(l.id)+'" style="flex-direction:column;align-items:stretch;gap:6px">'+
    '<div class="row between"><div class="grow"><b>'+(l.note?esc(l.note):'Borrowed')+'</b><div class="muted sm">'+fmtD(l.date,true)+' · borrowed '+fmt(l.amount)+'</div></div>'+
    '<div style="text-align:right"><div class="amt neg">'+fmt(left)+' left</div>'+dueTag(l)+'</div></div>'+
    '<div class="prog" style="margin:0;height:8px"><i style="width:'+pct+'%;background:var(--green)"></i></div></div>';
}
function loanHomeCard(){
  var open=state.loans.filter(function(l){return loanLeft(l)>0;});
  if(!open.length)return '';
  var late=open.filter(function(l){return l.due&&daysUntil(l.due)<0;}).length;
  var seen={},people=0;open.forEach(function(l){if(!seen[l.person]){seen[l.person]=1;people++;}});
  return '<div class="card" data-a="tab" data-tab="loans" style="cursor:pointer"><div class="row between"><h2 style="margin:0">Money you owe</h2>'+
    (late?'<span class="tag late">'+late+' overdue</span>':'<span class="tag">'+people+' '+(people===1?'person':'people')+'</span>')+'</div>'+
    '<div class="big" style="font-size:24px;margin:6px 0 0">'+fmt(totalOwed())+'</div><div class="muted sm">Tap to see who to pay back and when</div></div>';
}
function viewLoans(){
  var open=state.loans.filter(function(l){return loanLeft(l)>0;});
  var done=state.loans.filter(function(l){return loanLeft(l)<=0;});
  var people={};open.forEach(function(l){(people[l.person]=people[l.person]||[]).push(l);});
  function owedBy(n){var t=0;people[n].forEach(function(l){t+=loanLeft(l);});return t;}
  var names=Object.keys(people).sort(function(a,b){return owedBy(b)-owedBy(a);});
  var late=open.filter(function(l){return l.due&&daysUntil(l.due)<0;}).length;
  var out='<div class="card hero"><div class="sub">Total you owe</div><div class="big">'+fmt(totalOwed())+'</div><div class="sub">'+names.length+' '+(names.length===1?'person':'people')+(late?' · '+late+' overdue':'')+'</div></div>'+
    '<button class="btn" data-a="loan-add" style="margin-bottom:12px">＋ Borrow money</button>';
  if(!state.loans.length)out+='<div class="card empty">Nothing borrowed right now. 🎉<br>When you borrow from a class fellow or anyone else, tap “Borrow money” so you remember who and how much.</div>';
  names.forEach(function(n){
    var list=people[n].slice().sort(function(a,b){return a.date<b.date?-1:1;});
    out+='<div class="card"><div class="row between"><h2 style="margin:0">'+esc(n)+'</h2><b class="neg">'+fmt(owedBy(n))+'</b></div>'+list.map(loanRow).join('')+'</div>';
  });
  if(done.length)out+='<div class="card" style="opacity:.85"><h2>Fully repaid</h2>'+sortLoans(done).map(function(l){
    return '<div class="tx" data-a="loan-open" data-id="'+esc(l.id)+'"><div class="grow"><b>'+esc(l.person)+'</b><div class="muted sm">'+(l.note?esc(l.note)+' · ':'')+fmtD(l.date,true)+'</div></div><div class="amt pos">'+fmt(l.amount)+' ✓</div></div>';
  }).join('')+'</div>';
  if(state.loans.length)out+='<button class="btn ghost" data-a="export-loans">⬇ Export borrowed money (CSV)</button>';
  return out;
}

function openLoanSheet(id,focusRepay){
  var l=id?state.loans.filter(function(x){return x.id===id;})[0]:null;
  if(id&&!l)return;
  form=null;
  lform=l?{id:l.id,person:l.person,amount:String(l.amount),date:l.date,due:l.due||'',note:l.note||'',rAmt:focusRepay?String(loanLeft(l)):'',rDate:todayStr()}
         :{id:null,person:'',amount:'',date:todayStr(),due:'',note:'',rAmt:'',rDate:todayStr()};
  renderLoanSheet();
  var sel=focusRepay?'#lRAmt':(id?'':'#lPerson'), fe=sel?$(sel):null;
  if(fe)setTimeout(function(){fe.focus();},60);
}
function findLoan(id){return state.loans.filter(function(x){return x.id===id;})[0];}
function syncLoanForm(){
  if(!lform||!$('#lPerson'))return;
  lform.person=$('#lPerson').value;lform.amount=$('#lAmt').value;lform.date=$('#lDate').value;lform.due=$('#lDue').value;lform.note=$('#lNote').value;
  var r=$('#lRAmt');if(r){lform.rAmt=r.value;lform.rDate=$('#lRDate').value;}
}
function renderLoanSheet(){

function saveLoan(){
  syncLoanForm();var f=lform;
  var person=f.person.trim().slice(0,40);
  var amt=Math.round(parseFloat(String(f.amount).replace(/,/g,''))*100)/100;
  if(!person){toast('Enter the name of the person');return;}
  if(!isFinite(amt)||amt<=0||amt>1e9){toast('Enter a valid amount');return;}
  if(!DATE_RE.test(f.date)){toast('Pick the date you borrowed');return;}
  var due=DATE_RE.test(f.due)?f.due:null;
  if(due&&due<f.date){toast('Pay-back date is before the borrowed date');return;}
  var same=personNames().filter(function(n){return n.toLowerCase()===person.toLowerCase();})[0];if(same)person=same;
  var note=f.note.trim().slice(0,80);
  if(f.id){
    var l=findLoan(f.id);if(!l)return;
    if(amt<loanPaid(l)){toast('Amount cannot be less than what you already repaid ('+fmt(loanPaid(l))+')');return;}
    l.person=person;l.amount=amt;l.date=f.date;l.due=due;l.note=note;
  }else{
    state.loans.push({id:uid(),ts:Date.now(),person:person,amount:amt,date:f.date,due:due,note:note,payments:[]});
  }
  save();closeSheet();render();toast('Saved – you owe '+fmt(totalOwed())+' in total');
}
function recordPay(all){
  syncLoanForm();var f=lform, l=f.id?findLoan(f.id):null;if(!l)return;
  var left=loanLeft(l);
  var amt=all?left:Math.round(parseFloat(String(f.rAmt).replace(/,/g,''))*100)/100;
  if(!isFinite(amt)||amt<=0){toast('Enter the repayment amount');return;}
  if(amt>left){toast('That is more than you owe ('+fmt(left)+')');return;}
  l.payments=l.payments||[];
  l.payments.push({id:uid(),amount:amt,date:DATE_RE.test(f.rDate)?f.rDate:todayStr()});
  f.rAmt='';save();render();renderLoanSheet();
  toast(loanLeft(l)<=0?'Fully repaid 🎉':'Repayment recorded – '+fmt(loanLeft(l))+' left');
}
function exportLoans(){
  if(!state.loans.length){toast('Nothing to export yet');return;}
  var rows=[['Person','Date borrowed','Amount (PKR)','Repaid (PKR)','Remaining (PKR)','Pay back by','Note']];
  sortLoans(state.loans).reverse().forEach(function(l){rows.push([l.person,l.date,l.amount,loanPaid(l),loanLeft(l),l.due||'',l.note||'']);});
  var csv='﻿'+rows.map(function(r,i){return r.map(function(c,j){return (i>0&&(j===2||j===3||j===4))?c:csvCell(c);}).join(',');}).join('\r\n');
  download('borrowed-money-'+todayStr()+'.csv',csv,'text/csv;charset=utf-8');
  toast('Exported – open the file in Excel or Google Sheets');
}

function bucketsFor(list,start,end){
  var out=[],i,d;
  if(ui.period==='week'){
    for(i=0;i<7;i++){d=ymd(addDays(parse(start),i));out.push({label:dayName(d),value:sum(list.filter(function(t){return t.date===d;}),'expense')});}
  }else{
    var last=parse(end).getDate(), ranges=[[1,7],[8,14],[15,21],[22,last]];
    var ym=start.slice(0,8);
    ranges.forEach(function(r){
      var a=ym+pad(r[0]), b=ym+pad(r[1]);
      out.push({label:r[0]+'–'+r[1],value:sum(list.filter(function(t){return t.date>=a&&t.date<=b;}),'expense')});
    });
  }
  return out;
}

function donutHTML(list){

  var rows=Object.keys(map).map(function(k){return {name:k,value:map[k],color:catColor(k,'expense')};}).sort(function(a,b){return b.value-a.value;});
  var acc=0,stops=rows.map(function(r){var a=acc/total*100;acc+=r.value;var b=acc/total*100;return r.color+' '+a.toFixed(2)+'% '+b.toFixed(2)+'%';}).join(',');
  return '<div class="donutwrap"><div class="donut" style="background:conic-gradient('+stops+')"><div class="hole">'+fmt(total)+'</div></div>'+
    '<div class="legend">'+rows.map(function(r){
      return '<div class="tx"><span class="dot" style="background:'+r.color+'"></span><div class="grow">'+esc(r.name)+'</div><div class="sm"><b>'+fmt(r.value)+'</b> <span class="muted">'+Math.round(r.value/total*100)+'%</span></div></div>';

}

function saveForm(){
  syncForm();var f=form;
  var amt=Math.round(parseFloat(String(f.amount).replace(/,/g,''))*100)/100;
  if(!isFinite(amt)||amt<=0||amt>1e9){toast('Enter a valid amount');return;}
  if(!f.cat){toast('Pick a category');return;}
  if(!DATE_RE.test(f.date)){toast('Pick a date');return;}
  var rec=f.recur==='weekly'||f.recur==='monthly'?f.recur:'none';
  var obj={type:f.type,amount:amt,cat:f.cat,date:f.date,note:f.note.trim().slice(0,80),recur:rec,nextDue:rec==='none'?null:nextDate(f.date,rec)};
  if(f.id){
    for(var i=0;i<state.txns.length;i++){if(state.txns[i].id===f.id){state.txns[i]=Object.assign({},state.txns[i],obj);break;}}
  }else{
    obj.id=uid();obj.ts=Date.now();state.txns.push(obj);
  }
  save();closeSheet();render();
  if(obj.type==='expense')checkBudget(obj.date);
  else toast(f.id?'Saved':'Added');
}
function checkBudget(date){
  var wr=weekRange(0);
  if(!(state.budget>0)||date<wr[0]||date>wr[1]){toast('Saved');return;}
  var spent=sum(state.txns.filter(function(t){return inR(t,wr[0],wr[1]);}),'expense'), r=spent/state.budget;
  if(r>=1)toast('⚠ Over your weekly budget: '+fmt(spent)+' of '+fmt(state.budget));
  else if(r>=.8)toast('Careful: you have used '+Math.round(r*100)+'% of your weekly budget');
  else toast('Saved');
}

/* ---------- export / backup ---------- */
function download(name,text,mime){
  var b=new Blob([text],{type:mime}), a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
}
function csvCell(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(list,label){
  if(!list.length){toast('Nothing to export yet');return;}
  var rows=[['Date','Type','Category','Amount (PKR)','Note','Repeats']];
  sortTx(list).reverse().forEach(function(t){rows.push([t.date,t.type==='expense'?'Expense':'Income',t.cat,t.amount,t.note||'',t.recur||'none']);});
  var csv='\ufeff'+rows.map(function(r,i){return i===0?r.map(csvCell).join(','):r.map(function(c,j){return j===3?c:csvCell(c);}).join(',');}).join('\r\n');
  download('expenses-'+label+'.csv',csv,'text/csv;charset=utf-8');
  toast('Exported – open the file in Excel or Google Sheets');
}
function sanitizeImport(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.txns))throw new Error('Not a valid backup file');
  var out=defaults();
  out.txns=d.txns.filter(function(t){return t&&(t.type==='expense'||t.type==='income')&&isFinite(+t.amount)&&+t.amount>0&&typeof t.date==='string'&&DATE_RE.test(t.date)&&typeof t.cat==='string';}).map(function(t){
    var rec=(t.recur==='weekly'||t.recur==='monthly')?t.recur:'none';
    return {id:String(t.id||uid()),ts:+t.ts||Date.now(),type:t.type,amount:Math.round(+t.amount*100)/100,cat:String(t.cat).slice(0,40),date:t.date,note:String(t.note||'').slice(0,200),recur:rec,nextDue:(rec!=='none'&&typeof t.nextDue==='string'&&DATE_RE.test(t.nextDue))?t.nextDue:(rec==='none'?null:nextDate(t.date,rec))};
  });
  if(Array.isArray(d.cats)){
    d.cats.forEach(function(c){
      if(c&&typeof c.name==='string'&&(c.type==='expense'||c.type==='income')&&c.name.trim()){
        var exists=out.cats.some(function(x){return x.name===c.name.slice(0,24)&&x.type===c.type;});
        if(!exists)out.cats.push({name:c.name.slice(0,24),type:c.type,color:COLOR_RE.test(c.color)?c.color:'#78909c',custom:true});
      }
    });
  }
  if(Array.isArray(d.loans)){
    out.loans=d.loans.filter(function(l){return l&&typeof l.person==='string'&&l.person.trim()&&isFinite(+l.amount)&&+l.amount>0&&typeof l.date==='string'&&DATE_RE.test(l.date);}).map(function(l){
      var pays=Array.isArray(l.payments)?l.payments.filter(function(p){return p&&isFinite(+p.amount)&&+p.amount>0&&typeof p.date==='string'&&DATE_RE.test(p.date);}).map(function(p){return {id:String(p.id||uid()),amount:Math.round(+p.amount*100)/100,date:p.date};}):[];
      return {id:String(l.id||uid()),ts:+l.ts||Date.now(),person:l.person.trim().slice(0,40),amount:Math.round(+l.amount*100)/100,date:l.date,due:(typeof l.due==='string'&&DATE_RE.test(l.due))?l.due:null,note:String(l.note||'').slice(0,80),payments:pays};
    });
  }
  if(d.loansInBalance===false)out.loansInBalance=false;
  if(isFinite(+d.budget)&&+d.budget>=0)out.budget=+d.budget;
  if(d.weekStart===0||d.weekStart===1)out.weekStart=d.weekStart;
  if(['system','light','dark'].indexOf(d.theme)>-1)out.theme=d.theme;
  return out;
}

/* ---------- actions ---------- */
var A={
  'tab':function(el){ui.tab=el.getAttribute('data-tab');render();window.scrollTo(0,0);},
  'add':function(){if(ui.tab==='loans')openLoanSheet(null);else openSheet(null);},
  'loan-add':function(){openLoanSheet(null);},
  'loan-open':function(el){openLoanSheet(el.getAttribute('data-id'),false);},
  'loan-save':function(){saveLoan();},
  'loan-pay':function(){recordPay(false);},
  'loan-payall':function(){recordPay(true);},
  'loan-unpay':function(el){
    var l=lform&&lform.id?findLoan(lform.id):null;if(!l)return;
    syncLoanForm();
    var pid=el.getAttribute('data-pid');
    l.payments=(l.payments||[]).filter(function(p){return p.id!==pid;});
    save();render();renderLoanSheet();toast('Repayment removed');
  },
  'loan-del':function(){
    if(!lform||!lform.id)return;
    if(!confirm('Delete this borrowed-money record?'))return;
    var id=lform.id;state.loans=state.loans.filter(function(l){return l.id!==id;});
    save();closeSheet();render();toast('Deleted');
  },
  'export-loans':function(){exportLoans();},
  'edit':function(el){openSheet(el.getAttribute('data-id'));},
  'sheet-close':function(){closeSheet();},
  'f-type':function(el){syncForm();form.type=el.getAttribute('data-v');form.cat=firstCat(form.type);form.newCat=false;renderSheet();},
  'f-cat':function(el){syncForm();form.cat=el.getAttribute('data-v');renderSheet();},
  'f-newcat':function(){syncForm();form.newCat=true;renderSheet();var n=$('#fNew');if(n)n.focus();},
  'f-addcat':function(){
    var n=($('#fNew').value||'').trim();
    if(!n){toast('Type a category name');return;}
    var dup=state.cats.some(function(c){return c.type===form.type&&c.name.toLowerCase()===n.toLowerCase();});
    syncForm();
    if(!dup){state.cats.push({name:n,type:form.type,color:PALETTE[state.cats.length%PALETTE.length],custom:true});save();}
    var found=state.cats.filter(function(c){return c.type===form.type&&c.name.toLowerCase()===n.toLowerCase();})[0];
    form.cat=found.name;form.newCat=false;renderSheet();
  },
  'f-save':function(){saveForm();},
  'f-del':function(){
    if(!confirm('Delete this transaction?'))return;
    state.txns=state.txns.filter(function(t){return t.id!==form.id;});save();closeSheet();render();toast('Deleted');
  },
  'period':function(el){ui.period=el.getAttribute('data-v');render();},
  'prev':function(){if(ui.period==='week')ui.wOff--;else ui.mOff--;render();},
  'next':function(){if(ui.period==='week'){if(ui.wOff<0)ui.wOff++;}else{if(ui.mOff<0)ui.mOff++;}render();},
  'ftype':function(el){ui.ftype=el.getAttribute('data-v');render();},
  'export-period':function(){
    var isW=ui.period==='week', rg=isW?weekRange(ui.wOff):monthRange(ui.mOff);
    exportCSV(state.txns.filter(function(t){return inR(t,rg[0],rg[1]);}),isW?('week-'+rg[0]):('month-'+rg[0].slice(0,7)));
  },
  'export-all':function(){exportCSV(state.txns,'all-'+todayStr());},
  'backup':function(){download('expense-tracker-backup-'+todayStr()+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded');},
  'restore':function(){$('#restoreFile').click();},
  'reset':function(){
    if(!confirm('Delete ALL transactions, borrowed-money records and custom categories? This cannot be undone.'))return;
    if(!confirm('Really delete everything? Tip: make a backup first.'))return;
    state=defaults();save();render();toast('All data deleted');
  },
  'swatch':function(el){
    ui.newColor=el.getAttribute('data-c');
    var all=document.querySelectorAll('#swatches .sw');
    for(var i=0;i<all.length;i++)all[i].classList.toggle('on',all[i].getAttribute('data-c')===ui.newColor);
  },
  'cat-add':function(){
    var name=($('#ncName').value||'').trim(), type=$('#ncType').value;
    if(!name){toast('Type a category name');return;}
    if(state.cats.some(function(c){return c.type===type&&c.name.toLowerCase()===name.toLowerCase();})){toast('That category already exists');return;}
    state.cats.push({name:name,type:type,color:ui.newColor,custom:true});save();render();toast('Category added');
  },
  'cat-ren':function(el){
    var old=el.getAttribute('data-name'), type=el.getAttribute('data-type');
    var n=prompt('Rename category',old);if(n===null)return;n=n.trim().slice(0,24);
    if(!n||n===old)return;
    if(state.cats.some(function(c){return c.type===type&&c.name.toLowerCase()===n.toLowerCase();})){toast('That name is already used');return;}
    state.cats.forEach(function(c){if(c.name===old&&c.type===type)c.name=n;});
    state.txns.forEach(function(t){if(t.cat===old&&t.type===type)t.cat=n;});
    save();render();
  },
  'cat-del':function(el){
    var name=el.getAttribute('data-name'), type=el.getAttribute('data-type');
    var fallback=type==='expense'?'Others':'Other Income';
    if(!confirm('Delete "'+name+'"? Its transactions will move to "'+fallback+'".'))return;
    state.txns.forEach(function(t){if(t.cat===name&&t.type===type)t.cat=fallback;});
    state.cats=state.cats.filter(function(c){return !(c.name===name&&c.type===type);});
    save();render();
  },
  'rem-log':function(el){
    var id=el.getAttribute('data-id'), t=state.txns.filter(function(x){return x.id===id;})[0];if(!t)return;
    var td=todayStr();
    state.txns.push({id:uid(),ts:Date.now(),type:t.type,amount:t.amount,cat:t.cat,date:td,note:t.note||'',recur:t.recur,nextDue:nextDate(td,t.recur)});
    t.recur='none';t.nextDue=null;save();render();
    if(t.type==='expense')checkBudget(td);else toast('Added');
  },
  'rem-skip':function(el){
    var id=el.getAttribute('data-id'), t=state.txns.filter(function(x){return x.id===id;})[0];if(!t)return;
    var n=t.nextDue,g=0,td=todayStr();
    do{n=nextDate(n,t.recur);g++;}while(n<=td&&g<400);
    t.nextDue=n;save();render();toast('Skipped until '+fmtD(n));
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(!el)return;
  var fn=A[el.getAttribute('data-a')];
  if(fn){fn(el);}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='histQ'){ui.q=e.target.value;$('#histList').innerHTML=histListHTML();}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.id)return;
  if(t.id==='histCat'){ui.fcat=t.value;$('#histList').innerHTML=histListHTML();}
  else if(t.id==='budgetIn'){var v=parseFloat(String(t.value).replace(/,/g,''));if(isFinite(v)&&v>=0){state.budget=v;save();toast('Weekly budget saved');}else{toast('Enter a valid number');t.value=state.budget;}}
  else if(t.id==='weekStartSel'){state.weekStart=Number(t.value)===0?0:1;save();render();}
  else if(t.id==='themeSel'){state.theme=t.value;save();applyTheme();}
  else if(t.id==='loanBalSel'){state.loansInBalance=t.value==='1';save();toast('Saved');}
  else if(t.id==='restoreFile'){
    var file=t.files&&t.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var imp=sanitizeImport(JSON.parse(String(rd.result)));
        if(confirm('Replace current data with this backup ('+imp.txns.length+' transactions)?')){state=imp;save();render();toast('Backup restored');}
      }catch(err){toast('That file is not a valid backup');}
      t.value='';
    };
    rd.onerror=function(){toast('Could not read that file');};
    rd.readAsText(file);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(form||lform))closeSheet();
  if(e.key==='Enter'&&form&&e.target&&(e.target.id==='fAmt'||e.target.id==='fNote'))saveForm();
  if(e.key==='Enter'&&form&&e.target&&e.target.id==='fNew'){A['f-addcat']();}
});
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onMq=function(){if(state.theme==='system')applyTheme();};
  if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!form&&ui.tab==='home')render();});

render();
})();
</script>
